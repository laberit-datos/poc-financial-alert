name: Update financial alert HTML

on:
  repository_dispatch:
    types: [update_financial_html]

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate index.html
        env:
          HTML_B64: ${{ github.event.client_payload.html_b64 }}
        run: |
          printf '%s' "$HTML_B64" | base64 --decode > index.html

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Update financial alert"
          git push
