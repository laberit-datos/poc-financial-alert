name: Update financial alert HTML

on:
  repository_dispatch:
    types: [update_financial_html]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Generate site
        env:
          HTML_B64: ${{ github.event.client_payload.html_b64 }}
        run: |
          mkdir -p _site
          printf '%s' "$HTML_B64" | base64 --decode > _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
