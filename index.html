<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Financial Alert</title>

<style>
:root{
  --bg:#f4f6f9;
  --card:#ffffff;
  --ink:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --critical:#991b1b;
  --positive:#047857;
  --negative:#b91c1c;
  --dark:#111827;
  --soft-green:#ecfdf5;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.page{max-width:1440px;margin:auto;padding:28px}
.header{background:linear-gradient(135deg,#111827 0%,#1f2937 100%);color:#fff;border-radius:20px;padding:30px 34px;box-shadow:0 8px 30px rgba(17,24,39,.15)}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.criticality{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.8px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.period{font-size:14px;color:#d1d5db}
h1{margin:18px 0 10px;font-size:32px;line-height:1.18;max-width:1100px}
.summary{max-width:1150px;font-size:15px;line-height:1.65;color:#d1d5db}
.section-title{margin:28px 0 14px;font-size:18px;font-weight:800}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 18px rgba(15,23,42,.05)}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.65px;font-weight:700}
.kpi-value{margin-top:8px;font-size:29px;font-weight:800}
.kpi-sub{margin-top:7px;font-size:13px;color:var(--muted)}
.negative{color:var(--negative)}
.positive{color:var(--positive)}
.two-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:18px;margin-top:18px}
.panel-title{font-size:16px;font-weight:800;margin-bottom:12px}
.message{line-height:1.65;font-size:14px;color:#374151}
.signal-box{margin-top:16px;padding:12px 14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
.signal-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px dashed #e5e7eb}
.signal-row:last-child{border-bottom:none}
.signal-value{font-weight:700;text-align:right}
.dynamic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.driver{position:relative;overflow:hidden}
.driver::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--negative)}
.driver-rank{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.driver-title{margin-top:5px;font-size:20px;font-weight:800}
.driver-impact{font-size:26px;font-weight:800;margin:10px 0;color:var(--negative)}
.driver-text{font-size:13px;line-height:1.55;color:#4b5563}
.tags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2f7;color:#374151}
.compensator-wrap{display:flex;gap:10px;flex-wrap:wrap}
.compensator{border-radius:12px;padding:10px 13px;background:var(--soft-green);color:#065f46;border:1px solid #bbf7d0;font-size:13px}
.action-number{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--dark);color:#fff;font-size:13px;font-weight:800}
.action-title{margin:12px 0 7px;font-weight:800}
.action-detail{font-size:13px;line-height:1.55;color:#4b5563}
.chart{min-height:290px;width:100%}
.chart svg{width:100%;height:285px;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)}
.legend-item{display:inline-flex;align-items:center;gap:7px}
.legend-line{width:22px;height:3px;border-radius:999px}
.legend-dashed{width:22px;border-top:2px dashed #9ca3af}
.waterfall-wrap{overflow-x:auto}
.waterfall{min-width:720px}
.empty{display:none!important}
.footer{margin-top:30px;text-align:center;font-size:11px;color:#9ca3af}
@media(max-width:980px){.two-cols{grid-template-columns:1fr}.page{padding:16px}.header{padding:24px}}
@media print{body{background:#fff}.page{max-width:none;padding:10mm}.card{box-shadow:none}.header{box-shadow:none}.section-title{break-after:avoid}.card{break-inside:avoid}}
</style>
</head>

<body>
<div class="page">
  <section class="header">
    <div class="header-top">
      <div id="criticality" class="criticality"></div>
      <div id="periodo" class="period"></div>
    </div>
    <h1 id="headline"></h1>
    <div id="resumen" class="summary"></div>
  </section>

  <div class="section-title">Situación ejecutiva</div>
  <section id="kpis" class="kpi-grid"></section>

  <section class="two-cols">
    <div class="card">
      <div class="panel-title">Puente del EBITDA</div>
      <div class="waterfall-wrap">
        <div id="waterfall" class="chart waterfall"></div>
      </div>
    </div>

    <div class="card">
      <div class="panel-title">Lectura ejecutiva</div>
      <div id="tendenciaMensaje" class="message"></div>

      <div id="signalBox" class="signal-box"></div>

      <div id="compensatorBlock">
        <div class="panel-title" style="margin-top:18px">Factores compensadores</div>
        <div id="compensadores" class="compensator-wrap"></div>
      </div>
    </div>
  </section>

  <div class="section-title">Evolución del EBITDA</div>
  <section class="card">
    <div id="trendChart" class="chart"></div>
    <div class="legend">
      <span class="legend-item"><span class="legend-line" style="background:#991b1b"></span>EBITDA real</span>
      <span class="legend-item"><span class="legend-dashed"></span>Presupuesto</span>
    </div>
  </section>

  <section id="driverSection">
    <div class="section-title">Prioridades de investigación</div>
    <div id="drivers" class="dynamic-grid"></div>
  </section>

  <section id="actionSection">
    <div class="section-title">Plan de actuación</div>
    <div id="acciones" class="dynamic-grid"></div>
  </section>

  <div class="footer">Executive Financial Alert · Generado automáticamente</div>
</div>

<script>

EUR","real":104000.0,"previsto":122000.0,"anioAnterior":75000.0,"desvPresupuesto":-14.754098360655737,"desvAnioAnterior":38.666666666666664,"unidadDesviacion":"%"},{"periodo":"2026-09","indicador":"Margen Bruto","tipo":"KPI","unidadValor":"EUR","real":450000.0,"previsto":528000.0,"anioAnterior":470000.0,"desvPresupuesto":-14.772727272727273,"desvAnioAnterior":-4.25531914893617,"unidadDesviacion":"%"},{"periodo":"2026-09","indicador":"Margen %","tipo":"KPI","unidadValor":"%","real":37.1900826446281,"previsto":40.0,"anioAnterior":41.228070175438596,"desvPresupuesto":-2.809917355371905,"desvAnioAnterior":-4.0379875308105,"unidadDesviacion":"pp"},{"periodo":"2026-09","indicador":"EBITDA","tipo":"KPI","unidadValor":"EUR","real":26000.0,"previsto":138000.0,"anioAnterior":136000.0,"desvPresupuesto":-81.15942028985508,"desvAnioAnterior":-80.88235294117648,"unidadDesviacion":"%"}],"tendencia6Meses":[{"periodo":"2026-04","ventasReal":1200000.0,"ventasPpto":1220000.0,"margenPctReal":39.33333333333333,"margenPctPpto":40.0,"ebitdaReal":103000,"ebitdaPpto":129000,"personalReal":219000.0,"marketingReal":45000.0,"costeVentasReal":728000.0,"costeVentasPpto":732000.0,"personalPpto":215000.0,"marketingPpto":42000.0,"otrosOpexReal":105000.0,"otrosOpexPpto":102000.0,"margenBrutoReal":472000,"margenBrutoPpto":488000,"desvEbitdaPpto":-20.155038759689923},{"periodo":"2026-05","ventasReal":1215000.0,"ventasPpto":1240000.0,"margenPctReal":38.93004115226337,"margenPctPpto":40.0,"ebitdaReal":100000,"ebitdaPpto":133000,"personalReal":221000.0,"marketingReal":46000.0,"costeVentasReal":742000.0,"costeVentasPpto":744000.0,"personalPpto":216000.0,"marketingPpto":43000.0,"otrosOpexReal":106000.0,"otrosOpexPpto":104000.0,"margenBrutoReal":473000,"margenBrutoPpto":496000,"desvEbitdaPpto":-24.81203007518797},{"periodo":"2026-06","ventasReal":1255000.0,"ventasPpto":1260000.0,"margenPctReal":40.0,"margenPctPpto":40.0,"ebitdaReal":132000,"ebitdaPpto":135000,"personalReal":223000.0,"marketingReal":47000.0,"costeVentasReal":753000.0,"costeVentasPpto":756000.0,"personalPpto":218000.0,"marketingPpto":44000.0,"otrosOpexReal":100000.0,"otrosOpexPpto":107000.0,"margenBrutoReal":502000,"margenBrutoPpto":504000,"desvEbitdaPpto":-2.2222222222222223},{"periodo":"2026-07","ventasReal":1295000.0,"ventasPpto":1280000.0,"margenPctReal":38.996138996138995,"margenPctPpto":40.0,"ebitdaReal":119000,"ebitdaPpto":135000,"personalReal":228000.0,"marketingReal":50000.0,"costeVentasReal":790000.0,"costeVentasPpto":768000.0,"personalPpto":220000.0,"marketingPpto":45000.0,"otrosOpexReal":108000.0,"otrosOpexPpto":112000.0,"margenBrutoReal":505000,"margenBrutoPpto":512000,"desvEbitdaPpto":-11.851851851851853},{"periodo":"2026-08","ventasReal":1240000.0,"ventasPpto":1300000.0,"margenPctReal":37.983870967741936,"margenPctPpto":40.0,"ebitdaReal":71000,"ebitdaPpto":135000,"personalReal":245000.0,"marketingReal":62000.0,"costeVentasReal":769000.0,"costeVentasPpto":780000.0,"personalPpto":220000.0,"marketingPpto":45000.0,"otrosOpexReal":93000.0,"otrosOpexPpto":120000.0,"margenBrutoReal":471000,"margenBrutoPpto":520000,"desvEbitdaPpto":-47.40740740740741},{"periodo":"2026-09","ventasReal":1210000.0,"ventasPpto":1320000.0,"margenPctReal":37.1900826446281,"margenPctPpto":40.0,"ebitdaReal":26000,"ebitdaPpto":138000,"personalReal":252000.0,"marketingReal":68000.0,"costeVentasReal":760000.0,"costeVentasPpto":792000.0,"personalPpto":222000.0,"marketingPpto":46000.0,"otrosOpexReal":104000.0,"otrosOpexPpto":122000.0,"margenBrutoReal":450000,"margenBrutoPpto":528000,"desvEbitdaPpto":-81.15942028985508}],"drivers":[{"area":"Ventas","prioridad":1,"impactoEbitda":-110000.0,"real":1210000.0,"presupuesto":1320000.0,"dimensiones":["Cliente","Línea de negocio","Volumen","Precio"]},{"area":"Personal","prioridad":2,"impactoEbitda":-30000.0,"real":252000.0,"presupuesto":222000.0,"dimensiones":["Departamento","FTE","Horas extra","Temporalidad"]},{"area":"Marketing","prioridad":3,"impactoEbitda":-22000.0,"real":68000.0,"presupuesto":46000.0,"dimensiones":["Campaña","Canal","Inversión","Leads","Oportunidades","ROI"]}],"compensadores":[{"area":"Coste de ventas","orden":1,"impactoEbitda":32000.0,"real":760000.0,"presupuesto":792000.0,"tipoImpacto":"compensador"},{"area":"Otros OPEX","orden":2,"impactoEbitda":18000.0,"real":104000.0,"presupuesto":122000.0,"tipoImpacto":"compensador"}],"hechosEvolucion":{"periodoActual":"2026-09","ebitdaEstadoUltimoMes":"EMPEORA","ebitdaCambioVsMesAnteriorPP":-33.752012882447666,"ebitdaRacha":3,"ebitdaMesMayorRecuperacion":"2026-06","ebitdaRecuperacionConRecaida":"SI","ventasEstadoUltimoMes":"BAJA","ventasRacha":2,"ventasMesMaximo":"2026-07","ventasValorMaximo":1295000.0,"personalEstadoUltimoMes":"SUBE","personalRacha":5,"marketingEstadoUltimoMes":"SUBE","marketingRacha":5,"margenEstadoUltimoMes":"BAJA","margenRacha":3},"investigaciones":[{"area":"Ventas","prioridad":1,"motivo":"Las ventas se sitúan un 8% por debajo del presupuesto y acumulan dos meses de descenso tras el máximo de julio, impactando directamente en el margen y el EBITDA.","dimensiones":["Cliente","Línea de negocio","Volumen","Precio"]},{"area":"Personal","prioridad":2,"motivo":"El gasto de personal supera en un 13% el presupuesto y mantiene una tendencia ascendente de cinco meses, reduciendo la rentabilidad operativa.","dimensiones":["Departamento","FTE","Horas extra","Temporalidad"]},{"area":"Marketing","prioridad":3,"motivo":"El gasto en marketing excede en un 48% el presupuesto y continúa al alza, lo que agrava la presión sobre el EBITDA sin evidencia aún de retorno proporcional.","dimensiones":["Campaña","Canal","Inversión","Leads","Oportunidades","ROI"]}],"acciones":[{"orden":1,"titulo":"Analizar causas de la caída de ventas","detalle":"Revisar comportamiento por cliente, línea de negocio, volumen y precio para identificar los factores que explican la pérdida de ingresos tras el máximo de julio."},{"orden":2,"titulo":"Revisar estructura y evolución del gasto de personal","detalle":"Contrastar la evolución del gasto con la dotación de FTE, horas extra y temporalidad para determinar los elementos que impulsan el incremento sostenido."},{"orden":3,"titulo":"Evaluar incremento de inversión en marketing","detalle":"Analizar campañas, canales y retorno esperado para verificar si el aumento de gasto está generando oportunidades o requiere reorientación."}]};

const config = {
  maxKPIs: 4,
  severity: { normal: -10, attention: -20, high: -30 }
};

const money = value =>
  new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(value || 0));

const compactMoney = value => {
  const n = Number(value || 0);
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if(abs >= 1000000) return `${sign}${(abs/1000000).toFixed(2).replace('.',',')} M€`;
  if(abs >= 1000) return `${sign}${Math.round(abs/1000)} k€`;
  return `${sign}${Math.round(abs)} €`;
};

const pct = value => `${Number(value || 0).toFixed(1).replace('.',',')} %`;
const pp = value => `${Number(value || 0).toFixed(1).replace('.',',')} pp`;

function getIndicador(nombre){
  return (report.periodoActual || []).find(x => x.indicador === nombre);
}
function getInvestigacion(area){
  return (report.investigaciones || []).find(x => x.area === area);
}
function safeArray(value){ return Array.isArray(value) ? value : []; }

function getCriticality(){
  const ebitda = getIndicador('EBITDA');
  const dev = Number(ebitda?.desvPresupuesto ?? 0);

  if(dev <= config.severity.high) return {label:'CRÍTICA', bg:'#7f1d1d', fg:'#ffffff'};
  if(dev <= config.severity.attention) return {label:'ALTA', bg:'#92400e', fg:'#ffffff'};
  if(dev <= config.severity.normal) return {label:'ATENCIÓN', bg:'#854d0e', fg:'#ffffff'};
  return {label:'NORMAL', bg:'#065f46', fg:'#ffffff'};
}

const criticality = getCriticality();
const critEl = document.getElementById('criticality');
critEl.style.background = criticality.bg;
critEl.style.color = criticality.fg;
critEl.innerHTML = `<span class="dot"></span>ALERTA ${criticality.label}`;

document.getElementById('periodo').textContent = report.meta?.periodo || '';
document.getElementById('headline').textContent = report.analisis?.headline || '';
document.getElementById('resumen').textContent = report.analisis?.resumen || '';
document.getElementById('tendenciaMensaje').textContent = report.analisis?.tendenciaMensaje || '';

function renderKPIs(){
  const ebitda = getIndicador('EBITDA');
  const margen = getIndicador('Margen %');
  const ventas = getIndicador('Ventas');

  const kpis = [
    ebitda && {label:'EBITDA',value:money(ebitda.real),sub:`Presupuesto ${money(ebitda.previsto)}`,negative:Number(ebitda.real) < Number(ebitda.previsto)},
    ebitda && {label:'Gap EBITDA',value:money(Number(ebitda.real)-Number(ebitda.previsto)),sub:`Desviación ${pct(ebitda.desvPresupuesto)}`,negative:Number(ebitda.real) < Number(ebitda.previsto)},
    margen && {label:'Margen %',value:pct(margen.real),sub:`Desviación ${pp(margen.desvPresupuesto)}`,negative:Number(margen.desvPresupuesto) < 0},
    ventas && {label:'Ventas',value:money(ventas.real),sub:`Presupuesto ${money(ventas.previsto)}`,negative:Number(ventas.real) < Number(ventas.previsto)}
  ].filter(Boolean).slice(0,config.maxKPIs);

  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value ${k.negative ? 'negative':'positive'}">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
    </div>
  `).join('');
}

function renderSignals(){
  const h = report.hechosEvolucion || {};
  const rows = [];

  if(h.ebitdaEstadoUltimoMes) rows.push(['EBITDA', `${h.ebitdaEstadoUltimoMes} · racha ${h.ebitdaRacha ?? '-'}`]);
  if(h.ventasEstadoUltimoMes) rows.push(['Ventas', `${h.ventasEstadoUltimoMes} · racha ${h.ventasRacha ?? '-'}`]);
  if(h.personalEstadoUltimoMes) rows.push(['Personal', `${h.personalEstadoUltimoMes} · racha ${h.personalRacha ?? '-'}`]);
  if(h.marketingEstadoUltimoMes) rows.push(['Marketing', `${h.marketingEstadoUltimoMes} · racha ${h.marketingRacha ?? '-'}`]);

  const box = document.getElementById('signalBox');
  if(!rows.length){ box.classList.add('empty'); return; }

  box.innerHTML = rows.map(r => `
    <div class="signal-row">
      <span>${r[0]}</span>
      <span class="signal-value">${r[1]}</span>
    </div>
  `).join('');
}

function renderDrivers(){
  const drivers = safeArray(report.drivers);
  const section = document.getElementById('driverSection');
  if(!drivers.length){ section.classList.add('empty'); return; }

  document.getElementById('drivers').innerHTML = drivers.map(driver => {
    const inv = getInvestigacion(driver.area);
    return `
      <article class="card driver">
        <div class="driver-rank">PRIORIDAD ${driver.prioridad ?? ''}</div>
        <div class="driver-title">${driver.area || ''}</div>
        <div class="driver-impact">${money(driver.impactoEbitda)}</div>
        <div class="driver-text">${inv?.motivo || ''}</div>
        <div class="tags">
          ${safeArray(driver.dimensiones).map(d => `<span class="tag">${d}</span>`).join('')}
        </div>
      </article>
    `;
  }).join('');
}

function renderCompensators(){
  const items = safeArray(report.compensadores);
  const block = document.getElementById('compensatorBlock');
  if(!items.length){ block.classList.add('empty'); return; }

  document.getElementById('compensadores').innerHTML = items.map(c => `
    <div class="compensator">
      <strong>${c.area}</strong>&nbsp; ${compactMoney(c.impactoEbitda)}
    </div>
  `).join('');
}

function renderActions(){
  const actions = safeArray(report.acciones);
  const section = document.getElementById('actionSection');
  if(!actions.length){ section.classList.add('empty'); return; }

  document.getElementById('acciones').innerHTML = actions.map(a => `
    <article class="card">
      <div class="action-number">${a.orden ?? ''}</div>
      <div class="action-title">${a.titulo || ''}</div>
      <div class="action-detail">${a.detalle || ''}</div>
    </article>
  `).join('');
}

function renderTrend(){
  const data = safeArray(report.tendencia6Meses);
  const target = document.getElementById('trendChart');

  if(data.length < 2){
    target.innerHTML = '<div class="message">Sin datos suficientes para representar la tendencia.</div>';
    return;
  }

  const width = 1000;
  const height = 260;
  const padL = 55, padR = 20, padT = 22, padB = 35;

  const values = data.flatMap(d => [Number(d.ebitdaReal||0),Number(d.ebitdaPpto||0)]);
  const minV = Math.min(...values,0);
  const maxV = Math.max(...values,1);
  const range = Math.max(maxV-minV,1);

  const xStep = (width-padL-padR)/(data.length-1);
  const y = v => padT + (maxV-Number(v||0))/range * (height-padT-padB);

  const realPoints = data.map((d,i)=>`${padL+i*xStep},${y(d.ebitdaReal)}`).join(' ');
  const pptoPoints = data.map((d,i)=>`${padL+i*xStep},${y(d.ebitdaPpto)}`).join(' ');

  const labels = data.map((d,i)=>`
    <text x="${padL+i*xStep}" y="${height-8}" text-anchor="middle" font-size="11" fill="#6b7280">${d.periodo}</text>
  `).join('');

  const dots = data.map((d,i)=>`
    <circle cx="${padL+i*xStep}" cy="${y(d.ebitdaReal)}" r="4" fill="#991b1b"/>
  `).join('');

  target.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      <line x1="${padL}" y1="${height-padB}" x2="${width-padR}" y2="${height-padB}" stroke="#d1d5db"/>
      <polyline points="${pptoPoints}" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
      <polyline points="${realPoints}" fill="none" stroke="#991b1b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

function renderWaterfall(){
  const target = document.getElementById('waterfall');
  const ebitda = getIndicador('EBITDA');

  if(!ebitda){
    target.innerHTML = '<div class="message">No se dispone de EBITDA para construir el puente.</div>';
    return;
  }

  const start = Number(ebitda.previsto || 0);
  const end = Number(ebitda.real || 0);

  const impacts = [
    ...safeArray(report.drivers).map(x => ({label:x.area,value:Number(x.impactoEbitda||0)})),
    ...safeArray(report.compensadores).map(x => ({label:x.area,value:Number(x.impactoEbitda||0)}))
  ];

  const bars = [];
  let cumulative = start;

  bars.push({label:'EBITDA Ppto',from:0,to:start,value:start,total:true});

  impacts.forEach(item => {
    const from = cumulative;
    cumulative += item.value;
    bars.push({label:item.label,from,to:cumulative,value:item.value,total:false});
  });

  bars.push({label:'EBITDA Real',from:0,to:end,value:end,total:true});

  const allValues = bars.flatMap(b => [b.from,b.to,0]);
  const minV = Math.min(...allValues);
  const maxV = Math.max(...allValues);
  const range = Math.max(maxV-minV,1);

  const width = Math.max(820,bars.length*125);
  const height = 300;
  const padL = 45, padR = 20, padT = 28, padB = 70;
  const plotH = height-padT-padB;
  const y = v => padT + (maxV-v)/range*plotH;
  const zeroY = y(0);
  const step = (width-padL-padR)/bars.length;
  const barW = Math.min(58,step*.56);

  let svgBars = '';
  let connectors = '';

  bars.forEach((b,i)=>{
    const x = padL + i*step + (step-barW)/2;
    const topVal = Math.max(b.from,b.to);
    const bottomVal = Math.min(b.from,b.to);
    const yTop = y(topVal);
    const yBottom = y(bottomVal);
    const h = Math.max(2,yBottom-yTop);

    let fill = '#111827';
    if(!b.total) fill = b.value >= 0 ? '#047857' : '#b91c1c';

    svgBars += `
      <rect x="${x}" y="${yTop}" width="${barW}" height="${h}" rx="6" fill="${fill}" opacity=".94"/>
      <text x="${x+barW/2}" y="${Math.max(14,yTop-7)}" text-anchor="middle" font-size="11" font-weight="700" fill="${fill}">
        ${compactMoney(b.value)}
      </text>
      <text x="${x+barW/2}" y="${height-44}" text-anchor="middle" font-size="10" fill="#4b5563">
        ${String(b.label).length > 16 ? String(b.label).slice(0,16)+'…' : b.label}
      </text>
    `;

    if(i>0 && i<bars.length-1){
      const prevX = padL + (i-1)*step + (step-barW)/2 + barW;
      const connectorY = y(b.from);
      connectors += `
        <line x1="${prevX}" y1="${connectorY}" x2="${x}" y2="${connectorY}"
              stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
      `;
    }
  });

  target.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMinYMin meet">
      <line x1="${padL}" y1="${zeroY}" x2="${width-padR}" y2="${zeroY}" stroke="#cbd5e1" stroke-width="1"/>
      ${connectors}
      ${svgBars}
    </svg>
  `;
}

renderKPIs();
renderSignals();
renderDrivers();
renderCompensators();
renderActions();
renderTrend();
renderWaterfall();
</script>
